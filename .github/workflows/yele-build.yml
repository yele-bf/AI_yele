name: yele-build

# Contrôle de compilation : voir docs/CONTRIBUTING-equipe.md §1.3 (CI obligatoire).
# Tourne sur les pull requests et sur push vers main : le commit fusionne est
# recontrôle, pour qu'une regression arrivee par un merge reste visible.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntaxe Python + point d'entrée du service
        run: python scripts/ci/py_check.py
